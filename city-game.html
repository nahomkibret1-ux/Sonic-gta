<style>

html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:'Noto Sans Ethiopic',system-ui,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:10px 14px;pointer-events:none}
.pill{background:var(--pn);color:var(--ink);border-radius:14px;padding:6px 14px;font-weight:800;font-size:18px}
#act{position:fixed;right:18px;bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:5;font-size:18px}
#mm{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:130px;height:130px;border-radius:14px;border:2px solid rgba(255,255,255,.75);z-index:4;background:#2b2f36}
#fire{position:fixed;right:18px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:5;width:72px;height:72px;border-radius:50%;padding:0;background:#e63946;color:#fff;font-size:26px}
#wp{position:fixed;right:18px;bottom:calc(184px + env(safe-area-inset-bottom,0px));z-index:5;font-size:15px;padding:8px 14px}
#joy{position:fixed;left:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:var(--pn);opacity:.7}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:var(--acc)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.7);color:#fff;text-align:center;padding:24px}
#ov h1{font-size:34px;margin:0 0 8px}#ov p{margin:0 0 20px;max-width:30ch;line-height:1.6}
button{font-weight:800;font-size:20px;font-family:inherit;cursor:pointer;background:var(--acc);color:#14202e;border:0;border-radius:14px;padding:12px 28px}
button:focus-visible{outline:3px solid #fff}
</style></head><body>

    if(!sir){sir={o:ac.createOscillator(),g:ac.createGain()};sir.o.type='triangle';sir.g.gain.value=0;sir.o.connect(sir.g);sir.g.connect(ac.destination);sir.o.start()}
    sir.o.frequency.value=(Math.floor(t*2)%2)?960:770;sir.g.gain.value=(d<160&&run)?.06*(1-d/160):0}}
let run=false,vx=0,vz=0,ph=0;const keys={},joy={x:0,y:0};
function reset(){if(drv){drv=null}pl.visible=true;clearPolice();vx=vz=0;pl.position.set(HC.x+3.5,0,HC.z-2.2);cam.position.set(pl.position.x,10.5,pl.position.z+9)}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyE'||e.code==='KeyF')toggle();if(e.code==='Digit1')setW(0);if(e.code==='Digit2')setW(1);if(e.code==='Digit3')setW(2)});addEventListener('keyup',e=>keys[e.code]=0);
const joyEl=document.getElementById('joy'),kn=document.getElementById('knob');
function jm(e){const r=joyEl.getBoundingClientRect(),t=e.touches?e.touches[0]:e;let x=(t.clientX-r.left-65)/50,y=(t.clientY-r.top-65)/50;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy.x=x;joy.y=y;kn.style.transform=`translate(${x*40}px,${y*40}px)`}
const je=()=>{joy.x=joy.y=0;kn.style.transform=''};
joyEl.addEventListener('touchstart',jm);joyEl.addEventListener('touchmove',jm);joyEl.addEventListener('touchend',je);
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);jm(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)jm(e)});joyEl.addEventListener('pointerup',je);
const ov=document.getElementById('ov');
document.getElementById('go').addEventListener('click',()=>{initAudio();reset();vx=vz=0;run=true;ov.style.display='none'});
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
  if(run){
    let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
    const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}
    if(drv){driveStep(dt,ix,iz)}else{const sp=15;vx+=(ix*sp-vx)*Math.min(1,dt*10);vz+=(iz*sp-vz)*Math.min(1,dt*10);
    pl.position.x+=vx*dt;pl.position.z+=vz*dt;
    for(const b of boxes){const dx=pl.position.x-b.x,dz=pl.position.z-b.z,ox=b.hw+.5-Math.abs(dx),oz=b.hd+.5-Math.abs(dz);
      if(ox>0&&oz>0){if(ox<oz)pl.position.x+=Math.sign(dx)*ox;else pl.position.z+=Math.sign(dz)*oz}}
    pl.position.x=Math.max(-90,Math.min(270,pl.position.x));pl.position.z=Math.max(-S/2,Math.min(S/2,pl.position.z));
    const spd=Math.hypot(vx,vz);if(spd>.5)pl.rotation.y=Math.atan2(vx,vz);
    ph+=dt*spd*.9;const sw=Math.sin(ph)*Math.min(1,spd/8)*.9;aL.rotation.x=sw;aR.rotation.x=-1.45+rec;lL.rotation.x=-sw;lR.rotation.x=sw;}
    
  }
  houseStep();npcStep(dt,run&&!drv);fireStep(dt);fxStep(dt);polStep(dt);drawMap();carsStep(dt,run&&!drv);const p=pl.position;
  const tgt=drv?new THREE.Vector3(p.x-Math.sin(drv.hd)*13,7,p.z-Math.cos(drv.hd)*13):new THREE.Vector3(p.x,inH?10.5:8.5,p.z+(inH?9:11.5));
  cam.position.lerp(tgt,Math.min(1,dt*(drv?4:5)));cam.lookAt(p.x,drv?1.5:2.4,p.z);
  fireEl.style.display=wpEl.style.display=(run&&!drv)?'block':'none';actEl.style.display=run&&(drv||nearCar())?'block':'none';actEl.textContent=drv?'🚶 ውጣ':'🚗 ግባ';
  sun.position.set(p.x+40,80,p.z+30);sun.target.position.copy(p);
  rd.render(scene,cam)}
reset();requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)});
